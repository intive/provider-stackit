apiVersion: mongodbflex.stackit.m.crossplane.io/v1alpha1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbflex/v1alpha1/instance
  labels:
    testing.upbound.io/example-name: example-mongodbflex
  name: example-mongodbflex
spec:
  forProvider:
    name: example-mongodbflex
    projectId: <PROJECT-ID>
    flavor:
      cpu: 1
      ram: 2
    storage:
      class: premium-perf2-mongodb
      size: 10
    version: "7.0"
    replicas: 1
    backupSchedule: "0 0 * * *"
    acl:
      - 192.0.2.0/24
    options:
      type: "Single"
      pointInTimeWindowHours: 7
